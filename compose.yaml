name: ause-discovery

# Bounded log rotation for every service. Override or remove per service in a
# Compose override file when the host uses its own log rotation.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ause_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-ause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ause}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.53.1@sha256:8d664d3d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
    logging: *default-logging
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-key-change-before-production}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health | grep -q available"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: ${AUSE_API_IMAGE:-ause-discovery-api:dev}
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    environment:
      AUSE_ENV: ${AUSE_ENV:-development}
      AUSE_DATABASE_URL: ${AUSE_DATABASE_URL:-postgres://ause:ause@postgres:5432/ause_discovery?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${AUSE_API_IMAGE:-ause-discovery-api:dev}
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AUSE_ENV: ${AUSE_ENV:-development}
      AUSE_LISTEN_ADDR: ${AUSE_LISTEN_ADDR:-:8080}
      AUSE_PUBLIC_BASE_PATH: ${AUSE_PUBLIC_BASE_PATH:-/ause-discovery/}
      AUSE_DATABASE_URL: ${AUSE_DATABASE_URL:-postgres://ause:ause@postgres:5432/ause_discovery?sslmode=disable}
      AUSE_MEILISEARCH_URL: ${AUSE_MEILISEARCH_URL:-http://meilisearch:7700}
      AUSE_MEILISEARCH_API_KEY: ${AUSE_MEILISEARCH_API_KEY:-local-development-key-change-before-production}
      AUSE_ARTIFACT_ROOT: ${AUSE_ARTIFACT_ROOT:-/var/lib/ause-discovery/artifacts}
      AUSE_IMPORT_TEMP_ROOT: ${AUSE_IMPORT_TEMP_ROOT:-/var/lib/ause-discovery/imports}
      AUSE_SESSION_SECRET: ${AUSE_SESSION_SECRET:-local-development-session-secret-change-before-production}
      AUSE_TRUSTED_PROXY_CIDRS: ${AUSE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - artifact-data:/var/lib/ause-discovery
    depends_on:
      migrate:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/ause-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    image: ${AUSE_WEB_IMAGE:-ause-discovery-web:dev}
    logging: *default-logging
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PUBLIC_BASE_PATH: ${VITE_PUBLIC_BASE_PATH:-/ause-discovery/}
    environment:
      AUSE_PUBLIC_BASE_PATH: ${AUSE_PUBLIC_BASE_PATH:-/ause-discovery/}
    ports:
      - "${AUSE_WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  meilisearch-data:
  artifact-data:
