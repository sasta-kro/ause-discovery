openapi: 3.1.0
info:
  title: AUSE Discovery API
  version: 0.1.0
  description: Public discovery and protected administration API.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      tags: [Health]
      responses: { '200': { $ref: '#/components/responses/Health' } }
  /health/ready:
    get:
      operationId: getReadyHealth
      tags: [Health]
      responses: { '200': { $ref: '#/components/responses/Health' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /search:
    get:
      operationId: searchProjects
      tags: [Public discovery]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/AcademicYear' }
        - { $ref: '#/components/parameters/Semester' }
        - { $ref: '#/components/parameters/ProgramKey' }
        - { $ref: '#/components/parameters/MajorKey' }
        - { $ref: '#/components/parameters/CourseKey' }
        - { $ref: '#/components/parameters/PersonIdQuery' }
        - { $ref: '#/components/parameters/StudentId' }
        - { $ref: '#/components/parameters/AdvisorId' }
        - { $ref: '#/components/parameters/CategoryKey' }
        - { $ref: '#/components/parameters/PlatformKey' }
        - { $ref: '#/components/parameters/DomainKey' }
        - { $ref: '#/components/parameters/TopicKey' }
        - { $ref: '#/components/parameters/TechnologyKey' }
        - { $ref: '#/components/parameters/ArtifactTypeFilter' }
        - { $ref: '#/components/parameters/HasArtifacts' }
        - { $ref: '#/components/parameters/HasReport' }
        - { $ref: '#/components/parameters/HasSlides' }
        - { $ref: '#/components/parameters/HasSourceCode' }
        - { $ref: '#/components/parameters/HasDataset' }
        - { $ref: '#/components/parameters/SearchSort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses: { '200': { $ref: '#/components/responses/SearchResponse' }, '503': { $ref: '#/components/responses/SearchUnavailable' } }
  /projects/{project_id}:
    get:
      operationId: getPublicProject
      tags: [Public discovery]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { $ref: '#/components/responses/PublicProject' }, '404': { $ref: '#/components/responses/NotFound' } }
  /people/{person_id}:
    get:
      operationId: getPublicPerson
      tags: [Public discovery]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses: { '200': { $ref: '#/components/responses/PublicPerson' }, '404': { $ref: '#/components/responses/NotFound' } }
  /catalogs:
    get:
      operationId: getCatalogs
      tags: [Public discovery]
      responses: { '200': { $ref: '#/components/responses/Catalogs' } }
  /artifacts/{artifact_id}/view:
    get:
      operationId: viewArtifact
      tags: [Public artifacts]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses: { '200': { description: Inline artifact content. }, '404': { $ref: '#/components/responses/NotFound' } }
  /artifacts/{artifact_id}/download:
    get:
      operationId: downloadArtifact
      tags: [Public artifacts]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses: { '200': { description: Downloadable artifact content. }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/auth/login:
    post:
      operationId: login
      tags: [Admin authentication]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Session' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /admin/auth/logout:
    post:
      operationId: logout
      tags: [Admin authentication]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '204': { description: Session revoked. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/auth/session:
    get:
      operationId: getSession
      tags: [Admin authentication]
      security: [{ sessionCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/Session' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Admin authentication]
      security: [{ sessionCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/Csrf' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/projects:
    get:
      operationId: listAdminProjects
      tags: [Admin projects]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectStatus' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/AdminProjectPage' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createProject
      tags: [Admin projects]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AdminProject' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/projects/{project_id}:
    get:
      operationId: getAdminProject
      tags: [Admin projects]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { $ref: '#/components/responses/AdminProject' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: replaceProject
      tags: [Admin projects]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceProjectRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AdminProject' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/projects/{project_id}/publish:
    post:
      operationId: publishProject
      tags: [Admin projects]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedRevision' }
      responses: { '200': { $ref: '#/components/responses/AdminProject' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/projects/{project_id}/delete:
    post:
      operationId: deleteProject
      tags: [Admin projects]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteProjectRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AdminProject' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/projects/{project_id}/restore:
    post:
      operationId: restoreProject
      tags: [Admin projects]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedRevision' }
      responses: { '200': { $ref: '#/components/responses/AdminProject' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/people:
    get:
      operationId: listAdminPeople
      tags: [Admin people]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/AdminPersonPage' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createPerson
      tags: [Admin people]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePersonRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AdminPerson' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/people/{person_id}:
    get:
      operationId: getAdminPerson
      tags: [Admin people]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses: { '200': { $ref: '#/components/responses/AdminPerson' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updatePerson
      tags: [Admin people]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePersonRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AdminPerson' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/projects/{project_id}/artifacts:
    post:
      operationId: uploadArtifact
      tags: [Admin artifacts]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/UploadArtifactRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Artifact' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/artifacts/{artifact_id}:
    patch:
      operationId: updateArtifact
      tags: [Admin artifacts]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateArtifactRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Artifact' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/artifacts/{artifact_id}/delete:
    post:
      operationId: deleteArtifact
      tags: [Admin artifacts]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedRevision' }
      responses: { '200': { $ref: '#/components/responses/Artifact' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/artifacts/{artifact_id}/restore:
    post:
      operationId: restoreArtifact
      tags: [Admin artifacts]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedRevision' }
      responses: { '200': { $ref: '#/components/responses/Artifact' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/artifacts/{artifact_id}/replace:
    post:
      operationId: replaceArtifact
      tags: [Admin artifacts]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ReplaceArtifactRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Artifact' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/imports:
    post:
      operationId: createImport
      tags: [Admin imports]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/CreateImportRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ImportBatch' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/imports/{batch_id}:
    get:
      operationId: getImport
      tags: [Admin imports]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses: { '200': { $ref: '#/components/responses/ImportBatch' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/imports/{batch_id}/rows:
    get:
      operationId: listImportRows
      tags: [Admin imports]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/ImportRowPage' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateImportRows
      tags: [Admin imports]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateImportRowsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ImportBatch' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/imports/{batch_id}/commit:
    post:
      operationId: commitImport
      tags: [Admin imports]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/ExpectedRevision' }
      responses: { '200': { $ref: '#/components/responses/ImportResult' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/RevisionConflict' } }
  /admin/imports/{batch_id}/result:
    get:
      operationId: getImportResult
      tags: [Admin imports]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses: { '200': { $ref: '#/components/responses/ImportResult' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/search/status:
    get:
      operationId: getSearchStatus
      tags: [Admin search]
      security: [{ sessionCookie: [] }]
      responses: { '200': { $ref: '#/components/responses/SearchStatus' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/search/projects/{project_id}/reindex:
    post:
      operationId: reindexProject
      tags: [Admin search]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '202': { $ref: '#/components/responses/ReindexProject' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/search/rebuilds:
    post:
      operationId: createSearchRebuild
      tags: [Admin search]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '202': { $ref: '#/components/responses/SearchRebuild' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/search/rebuilds/{operation_id}:
    get:
      operationId: getSearchRebuild
      tags: [Admin search]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses: { '200': { $ref: '#/components/responses/SearchRebuild' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Admin audit]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuditAction' }, { $ref: '#/components/parameters/AuditActorId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/AuditEventPage' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: ause_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  headers:
    RequestId: { schema: { type: string, minLength: 1, maxLength: 128 }, description: Server request identifier. }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PersonId: { name: person_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ArtifactId: { name: artifact_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BatchId: { name: batch_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OperationId: { name: operation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
    Query: { name: q, in: query, schema: { type: string, maxLength: 300 } }
    AcademicYear: { name: academic_year, in: query, schema: { type: integer, minimum: 1900, maximum: 9999 } }
    Semester: { name: semester, in: query, schema: { $ref: '#/components/schemas/Semester' } }
    ProgramKey: { name: program_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    MajorKey: { name: major_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    CourseKey: { name: course_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    PersonIdQuery: { name: person_id, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
    StudentId: { name: student_id, in: query, schema: { $ref: '#/components/schemas/StudentId' } }
    AdvisorId: { name: advisor_id, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
    CategoryKey: { name: category_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    PlatformKey: { name: platform_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    DomainKey: { name: domain_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    TopicKey: { name: topic_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    TechnologyKey: { name: technology_key, in: query, schema: { type: array, items: { $ref: '#/components/schemas/StableKey' } }, style: form, explode: true }
    ArtifactTypeFilter: { name: artifact_type, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ArtifactType' } }, style: form, explode: true }
    HasArtifacts: { name: has_artifacts, in: query, schema: { type: boolean } }
    HasReport: { name: has_report, in: query, schema: { type: boolean } }
    HasSlides: { name: has_slides, in: query, schema: { type: boolean } }
    HasSourceCode: { name: has_source_code, in: query, schema: { type: boolean } }
    HasDataset: { name: has_dataset, in: query, schema: { type: boolean } }
    SearchSort: { name: sort, in: query, schema: { type: string, enum: [relevance, newest, oldest, title] } }
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ProjectStatus: { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
    AuditAction: { name: action, in: query, schema: { type: string, maxLength: 100 } }
    AuditActorId: { name: actor_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
  requestBodies:
    ExpectedRevision: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedRevisionRequest' } } } }
  responses:
    Health: { description: Health status., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
    SearchResponse: { description: Search result page., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
