name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_images:
        description: Publish images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish application images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push_images == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image names and release version
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "API_IMAGE=ghcr.io/${repository}-api"
            echo "WEB_IMAGE=ghcr.io/${repository}-web"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "RELEASE_VERSION=${GITHUB_REF_NAME}"
            else
              echo "RELEASE_VERSION=${GITHUB_SHA::12}"
            fi
          } >> "$GITHUB_ENV"
      - name: Build and publish API image
        id: build_api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          tags: |
            ${{ env.API_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish web image
        id: build_web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_PUBLIC_BASE_PATH=/ause-discovery/
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image digest summary
        run: |
          {
            echo "## Released application images"
            echo "- API: \`${{ env.API_IMAGE }}:${{ env.RELEASE_VERSION }}\`"
            echo "- API digest: \`${{ env.API_IMAGE }}@${{ steps.build_api.outputs.digest }}\`"
            echo "- Web: \`${{ env.WEB_IMAGE }}:${{ env.RELEASE_VERSION }}\`"
            echo "- Web digest: \`${{ env.WEB_IMAGE }}@${{ steps.build_web.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Pushed: \`${{ env.PUSH_IMAGES }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
